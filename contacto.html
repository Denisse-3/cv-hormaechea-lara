<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Portfolio Denisse</title>
    <link rel="stylesheet" href="estilos.css" />
    <link rel="icon" href="img/favicon.png" type="image/png" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body>
    <header class="header-principal">
        <div class="contenedor">
            <a href="index.html"><img src="img/logo-claro.png" alt="logo-claro" width="77" height="61" /></a>
            <nav>
                <a href="sobremi.html" class="boton-sobremi">Sobre mí</a>
                <a href="proyectos.html" class="boton-proyectos">Proyectos</a>
                <a href="contacto.html" class="boton-contacto">Contacto</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="contacto" >
            
        </section>
        <!-- inicio del formulario -->
            <section class="formulario">
                
                <form method="post" action="mailto:hormecheald@gmail.com?subject=Email enviado desde el formulario" target="_blank" enctype="text/plain">
                    
                    <!-- parte izquierda del formulario -->
                    <div class="columna-izquierda-formulario">
                        
                        <label for="nombre">Nombre:</label>
                        <input type="text" name="nombre" id="nombre" maxlength="50" placeholder="Ej.: Lara" required>

                        <label for="apellido">Apellido:</label>
                        <input type="text" name="apellido" id="apellido" maxlength="50" placeholder="Ej.: Hormaechea" required>

                        <label>Email:</label>
                        <input type="email" name="email" id="email" placeholder="Ej.: laradh@gmail.com" required>

                        <p class="ayuda">En que puedo ayudarte?</p>
                        <label><input type="checkbox" name="intereses" value="identidad visual" id="identidad" required>Identidad visual</label>
                        <label><input type="checkbox" name="intereses" value="creación de logo" id="logo" required>Creación de logo</label>
                        <label><input type="checkbox" name="intereses" value="fotografia" id="fotografia" required>Ilutraciones</label>

                    </div>

                    <!-- parte derecha del formulario-->
                    <div class="columna-derecha-formulario">

                        <label for="mensaje">Mensaje</label>
                        <textarea name="mensaje" id="mensaje" maxlength="500" placeholder="Hola, me gustaria trabajar con vos! Queria saber..." required></textarea>

                        <p class="campos">*Campos obligatorios</p>

                        <input type="reset" value="Borrar" class="borrar">
                        <input type="submit" value="Enviar" class="enviar">
                        
                    </div>
                </form>
            </section>
    </main>
    <footer>
        <section id="f">
            <div class="f-izq">
                <img src="img/logo.png" alt="logo" width="100" height="100">
                <a href="https://www.instagram.com/d3306_/" target="_blank"><img src="img/ig.png" alt="instagram"
                        width="30" height="30"></a>
                <a href="https://www.linkedin.com/in/denisse-hormaechea-0b1b4b1b9/" target="_blank"><img
                        src="img/lin.png" alt="linkedin" width="30" height="30"></a>
                <a href="https://www.behance.net/laradehormaec" target="_blank"><img src="img/be.png" alt="behance"
                        width="30" height="30"></a>
            </div>
            <div class="f-centro">
                <h6>© 2024 Hormaechea Lara Denisse. Todos los derechos reservados.</h6>
                <h6>Cátedra Wischñevsky By Albornoz y Consentino</h6>
            </div>
            <div class="f-derecha">
                <h1>¡Gracias por ver!</h1>
            </div>
        </section>
    </footer>
</body>
